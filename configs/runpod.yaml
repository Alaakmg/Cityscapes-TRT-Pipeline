# Same as baseline.yaml, with paths for a RunPod pod
# (network volume mounted at /workspace).
seed: 42
data_root: /workspace/cityscapes
size_hw: [512, 1024]            # H, W, multiples of 32, fixed for the whole pipeline
batch_size: 8
workers: 8
epochs: 60
lr: 3.0e-4
weight_decay: 1.0e-4
warmup_iters: 500
out_dir: /workspace/runs/fp32

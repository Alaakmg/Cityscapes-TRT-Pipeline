[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segdeploy"
version = "0.1.0"
description = "Cityscapes semantic segmentation: FP32 PyTorch -> ONNX -> TensorRT INT8 on Jetson"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy",
    "pyyaml",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
export = ["onnx>=1.15", "onnxruntime>=1.17"]
qat = ["nvidia-modelopt"]
dev = ["pytest", "ruff", "black", "onnx>=1.15", "onnxruntime>=1.17"]
# TensorRT comes from the JetPack stack (Jetson) or pip (desktop) on the
# target device and is intentionally NOT a dependency here. The TRT runner
# and calibrator use torch tensors as device buffers, so no pycuda.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
